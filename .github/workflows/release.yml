name: Release

# Publishes to npm when a GitHub Release is published (or via manual dispatch).
# Never runs on push/PR, so a merge can't trigger a publish.
#
# Auth is npm Trusted Publishing (OIDC): the npm package is configured to trust
# this repo + workflow file, so no NPM_TOKEN secret is needed. Provenance is
# generated as part of the same OIDC exchange.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing + provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm can lag.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # `npm publish` runs the prepublishOnly hook (lint + build + test) first,
      # so a release that fails any of those is not published.
      - name: Publish to npm
        run: npm publish --provenance --access public
